<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <linearGradient id="cpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f5e9"/>
    </linearGradient>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #102a43; }
      .subtitle { font-size: 14px; fill: #486581; }
      .label { font-size: 13px; fill: #243b53; }
      .small { font-size: 11px; fill: #486581; }
      .path { font-size: 16px; font-weight: 700; fill: #1b5e20; }
      .moduleName { font-size: 14px; font-weight: 600; fill: #102a43; }
      .flowlabel { font-size: 12px; font-weight: 600; fill: #2e7d32; }
    </style>
  </defs>

  <!-- Title -->
  <text x="30" y="40" class="title">Direct Access via On-Board Ethernet (CompactLogix / ControlLogix)</text>
  <text x="30" y="64" class="subtitle">No routing needed: the controller's own Ethernet port is the connection target.</text>

  <!-- PC / RSLinx -->
  <rect x="30" y="170" width="160" height="90" rx="8" fill="#ffffff" stroke="#334e68" stroke-width="2"/>
  <text x="110" y="205" text-anchor="middle" class="moduleName">PC / OptixEdge</text>
  <text x="110" y="225" text-anchor="middle" class="small">Rockwell LINX</text>
  <text x="110" y="242" text-anchor="middle" class="small">(RSLinx)</text>

  <!-- Ethernet network cloud -->
  <ellipse cx="350" cy="215" rx="60" ry="42" fill="#e8f1fb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="350" y="210" text-anchor="middle" class="label">Ethernet</text>
  <text x="350" y="228" text-anchor="middle" class="small">network / direct cable</text>

  <!-- PC -> network -->
  <line x1="190" y1="215" x2="288" y2="215" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- network -> CPU -->
  <line x1="410" y1="215" x2="560" y2="215" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="485" y="203" text-anchor="middle" class="flowlabel">&lt;ipcpu&gt;</text>

  <!-- Controller with on-board ethernet -->
  <rect x="565" y="150" width="180" height="135" rx="10" fill="url(#cpu)" stroke="#1b5e20" stroke-width="2.5"/>
  <text x="655" y="180" text-anchor="middle" class="moduleName">CompactLogix /</text>
  <text x="655" y="200" text-anchor="middle" class="moduleName">ControlLogix CPU</text>
  <text x="655" y="222" text-anchor="middle" class="small">Built-in Ethernet port</text>
  <text x="655" y="252" text-anchor="middle" class="small">IP = &lt;ipcpu&gt;</text>
  <circle cx="655" cy="270" r="5" fill="#1b5e20"/>

  <!-- RJ45 port indicator -->
  <rect x="555" y="200" width="14" height="22" rx="2" fill="#1b5e20"/>

  <!-- Path callout -->
  <rect x="30" y="330" width="910" height="90" rx="10" fill="#e8f5e9" stroke="#1b5e20" stroke-width="1.5"/>
  <text x="50" y="362" class="label">Communication Path:</text>
  <text x="50" y="394" class="path">&lt;ipcpu&gt;</text>
  <text x="300" y="372" class="small">• &lt;ipcpu&gt; = IP address of the controller's on-board Ethernet port (e.g. 192.168.1.20)</text>
  <text x="300" y="394" class="small">• The CPU is reached directly — no ENET module, no backplane slot, no routing.</text>
  <text x="300" y="412" class="small">• Applies to CompactLogix and ControlLogix controllers that embed an Ethernet port.</text>
</svg>
